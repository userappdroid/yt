name: Android CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  JAVA_VERSION: '17'
  NDK_VERSION: 'r26d'

jobs:
  # ── Build FFmpeg native libraries ────────────────────────────────────────────
  build-ffmpeg-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache FFmpeg native libs
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: core-video/src/main/jniLibs
          key: ffmpeg-${{ hashFiles('scripts/build_ffmpeg.sh') }}-${{ env.NDK_VERSION }}

      - name: Setup NDK
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Build FFmpeg for arm64-v8a and x86_64
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          chmod +x scripts/build_ffmpeg.sh
          ./scripts/build_ffmpeg.sh \
            --abi arm64-v8a,x86_64 \
            --enable-gpl \
            --enable-libx264 \
            --enable-libmp3lame \
            --enable-libvpx \
            --output core-video/src/main/jniLibs

      - name: Upload native libs artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-native-libs
          path: core-video/src/main/jniLibs
          retention-days: 7
